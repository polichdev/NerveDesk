name: Feature Request
description: Propose a new capability, architectural optimization, or workflow improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome architectural proposals and feature ideas that align with low latency and security principles.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific limitation or pain point?
      placeholder: "A clear description of the problem or limitation..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Technical Design
      description: Describe your proposed approach and how it fits into the current architecture.
      placeholder: "Technical implementation details, APIs to consider (e.g. D3D12, AV1, WebRTC)..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other solutions or workarounds have you evaluated?
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a Pull Request for this feature.
